<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Команда 7Д класс</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f4; padding: 20px; }
        h1 { color: #333; }
        table { margin: 0 auto; border-collapse: collapse; background: white; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 12px 15px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
        .no-photo { color: #999; font-style: italic; }
    </style>
</head>
<body>
    <h1>⚽ Команда «7Д класс»</h1>
    <h2>Футбольная статистика состава</h2>

    <table>
        <thead>
            <tr>
                <th>Фото</th>
                <th>Игрок</th>
                <th>Позиция</th>
                <th>Матчи</th>
                <th>Голы</th>
                <th>Пасы</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><img src="stogov.jpg" alt="Стогов" onerror="this.style.display='none'; this.nextSibling.style.display='inline';"></td>
                <td class="no-photo">Стогов Артур</td>
                <td>Левый фланговый атакующий</td>
                <td>20</td>
                <td>15</td>
                <td>5</td>
            </tr>
            <tr>
                <td><img src="poskannoy.jpg" alt="Посканной" onerror="this.style.display='none'; this.nextSibling.style.display='inline';"></td>
                <td class="no-photo">Посканной Некита</td>
                <td>Правый фланговый атакующий</td>
                <td>50</td>
                <td>45</td>
                <td>25</td>
            </tr>
            <tr>
                <td><img src="grankin.jpg" alt="Гранкин" onerror="this.style.display='none'; this.nextSibling.style.display='inline';"></td>
                <td class="no-photo">Гранкин Александр</td>
                <td>Левый защитник</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
            </tr>
            <tr>
                <td><img src="klyshnikov.jpg" alt="Клышников" onerror="this.style.display='none'; this.nextSibling.style.display='inline';"></td>
                <td class="no-photo">Клышников Максим</td>
                <td>Правый защитник</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
            </tr>
            <!-- Добавь сюда остальных игроков по аналогии, если нужно -->
        </tbody>
    </table>
</body>
</html>
