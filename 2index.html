<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стогов Артур — Профиль игрока</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }
        .back-link {
            display: inline-block;
            color: #94a3b8;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .back-link:hover { color: #38bdf8; }
        .player-profile {
            max-width: 600px;
            margin: 0 auto;
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .player-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .player-photo-frame {
            width: 180px;
            height: 180px;
            border-radius: 12px;
            border: 4px solid #38bdf8; /* Рамка вокруг фото */
            margin: 0 auto 16px;
            overflow: hidden;
            background: #0f172a;
        }
        .player-photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Подпись под фото (на русском) */
        .photo-caption {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }
        .player-name-full {
            font-size: 1.8rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 4px;
        }
        .player-position-full {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        .player-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .info-item {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .info-label {
            color: #94a3b8;
            font-size: 0.75rem;
            text-transform: uppercase;
        }
        .info-value {
            color: #e2e8f0;
            font-weight: 600;
        }
        .player-stats-block {
            border-top: 1px solid #334155;
            padding-top: 20px;
        }
        .stats-title {
            font-size: 1.1rem;
            color: #38bdf8;
            margin-bottom: 12px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .stat-box {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-number {
            font-size: 1.4rem;
            font-weight: 700;
            color: #38bdf8;
        }
        .stat-label-small {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
        }
        @media (max-width: 480px) {
            .player-info-grid, .stats-grid { grid-template-columns: 1fr; }
            .player-photo-frame { width: 160px; height: 160px; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← Вернуться к составу</a>

    <div class="player-profile">
        <div class="player-header">
            <div class="player-photo-frame">
                <!-- Убедитесь, что фото лежит в папке img и называется stogov-artur.jpg -->
                <img src="img/stogov-artur.jpg" alt="Стогов Артур">
            </div>
            <!-- Подпись на русском строго под фото -->
            <div class="photo-caption">Фото игрока: Стогов Артур</div>
            
            <div class="player-name-full">Стогов Артур</div><div class="player-position-full">Левый фланговый атакующий</div>
        </div>

        <div class="player-info-grid">
            <div class="info-item">
                <div class="info-label">Состав</div>
                <div class="info-value">7Д</div>
            </div>
            <div class="info-item">
                <div class="info-label">Возраст</div>
                <div class="info-value">17 лет</div>
            </div>
            <div class="info-item">
                <div class="info-label">Амплуа</div>
                <div class="info-value">Атакующий</div>
            </div>
            <div class="info-item">
                <div class="info-label">Рост / Вес</div>
                <div class="info-value">178 см / 70 кг</div>
            </div>
        </div>

        <div class="player-stats-block">
            <div class="stats-title">Статистика</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-number">20</div>
                    <div class="stat-label-small">Матчи</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number">15</div>
                    <div class="stat-label-small">Голы</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number">5</div>
                    <div class="stat-label-small">Пасы</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
